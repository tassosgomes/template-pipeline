openapi: 3.1.0
info:
  title: Example service
  version: 1.0.0
  description: Public HTTP contract for the example service.
  contact:
    name: Platform team
servers:
  - url: https://api.example.test
tags:
  - name: widgets
    description: Widget operations.
paths:
  /v1/widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      description: Returns the widgets visible to the caller.
      tags: [widgets]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of widgets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Widget'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Widget:
      type: object
      required: [id]
      properties:
        id:
          type: string

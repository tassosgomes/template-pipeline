openapi: 3.1.0
info:
  title: Example service
  version: 1.1.0
paths:
  /v1/widgets:
    get:
      operationId: listWidgets
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: A list of widgets.
  /v1/widgets/{id}:
    get:
      operationId: getWidget
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A widget.

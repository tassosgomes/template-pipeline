name: CI · Java

# Workflow reusável da plataforma. Contrato idêntico ao das demais stacks (ver ADR 0002).
# Consumo:
#   jobs:
#     ci:
#       uses: tassosgomes/template-pipeline/.github/workflows/ci-java.yml@v1
#       with: { version: "21", coverage-threshold: 70 }

on:
  workflow_call:
    inputs:
      # ---------------------------------------------------------------- básico
      working-directory:
        description: 'Diretório do projeto dentro do repositório.'
        type: string
        default: '.'
      service-name:
        description: 'Nome estável do serviço. Tags serviço/vMAJOR.MINOR.PATCH também o definem.'
        type: string
        default: ''
      docker-context:
        description: 'Contexto Docker relativo à raiz do repositório. Vazio usa working-directory.'
        type: string
        default: ''
      dockerfile:
        description: 'Caminho do Dockerfile relativo à raiz do repositório. Vazio usa working-directory/Dockerfile.'
        type: string
        default: ''
      version:
        description: 'Versão do JDK (Temurin). Vazio usa o default da plataforma.'
        type: string
        default: ''
      runs-on:
        description: 'Runner a usar.'
        type: string
        default: 'ubuntu-latest'
      platform-ref:
        description: 'Ref da plataforma a carregar (tag, branch ou SHA). Ver ADR 0003.'
        type: string
        default: 'v1'

      # ------------------------------------------------------------ qualidade
      run-lint:
        type: boolean
        default: true
      run-tests:
        type: boolean
        default: true
      test-configuration:
        description: 'Configuração usada pelos testes. No .NET é passada exatamente uma vez; outras stacks registram como no-op.'
        type: string
        default: 'Release'
      coverage-threshold:
        description: 'Cobertura mínima em percentual. 0 desliga o gate.'
        type: number
        default: 0
      lint-args:
        description: 'Argumentos extras repassados ao lint (ver ADR 0002).'
        type: string
        default: ''
      test-args:
        description: 'Argumentos extras repassados aos testes.'
        type: string
        default: ''
      build-args:
        description: 'Argumentos extras repassados ao build.'
        type: string
        default: ''

      # -------------------------------------------------------------- empacote
      build-container:
        type: boolean
        default: false
      image-name:
        description: 'Nome da imagem no GHCR. Vazio usa o nome do repositório.'
        type: string
        default: ''
      upload-artifact:
        type: boolean
        default: true

      # ------------------------------------------------------------- segurança
      run-sast:
        type: boolean
        default: true
      run-secret-scan:
        type: boolean
        default: true
      run-dependency-scan:
        type: boolean
        default: true
      security-fail-on:
        description: 'none | critical | high | medium | low'
        type: string
        default: 'high'
      publish-findings:
        description: >
          Publica os achados no code scanning. Desligue para receber apenas artifact e job
          summary — útil durante a calibração, para não ter check vermelho no PR.
        type: boolean
        default: true
      security-mode:
        description: 'observe (só reporta) | enforce (reprova o job).'
        type: string
        default: 'observe'
      run-dast:
        description: 'DAST efêmero no PR. Exige build-container: true.'
        type: boolean
        default: false
      dast-port:
        type: number
        default: 8080
      dast-health-path:
        type: string
        default: '/health'
      dast-openapi-spec:
        description: 'Spec OpenAPI. Preenchido, troca o baseline pelo api-scan.'
        type: string
        default: ''

      # --------------------------------------------------------------- sonar
      run-sonar:
        description: 'Habilita o scan do SonarCloud. Exige secrets.sonar-token e sonar-project-key.'
        type: boolean
        default: false
      sonar-project-key:
        description: 'Chave do projeto no SonarCloud (sonar.projectKey).'
        type: string
        default: ''
      sonar-organization:
        description: 'Chave da organização no SonarCloud.'
        type: string
        default: 'tasssosgomes'
      sonar-host-url:
        description: 'URL do SonarCloud.'
        type: string
        default: 'https://sonarcloud.io'
      sonar-args:
        description: 'Argumentos extras repassados ao scanner Sonar.'
        type: string
        default: ''

    secrets:
      sonar-token:
        description: 'Token do SonarCloud (SONAR_TOKEN). Obrigatório quando run-sonar: true.'
        required: false

    outputs:
      service-name:
        description: 'Nome estável do serviço, derivado da tag ou do input.'
        value: ${{ jobs.build.outputs.service-name }}
      version:
        description: 'Versão calculada do artefato.'
        value: ${{ jobs.build.outputs.version }}
      artifact-name:
        description: 'Nome do artifact publicado.'
        value: ${{ jobs.build.outputs.artifact-name }}
      image-ref:
        description: 'Nome completo da imagem, sem tag ou digest.'
        value: ${{ jobs.build.outputs.image-ref }}
      image-digest:
        description: 'Digest imutável da imagem publicada. Consumido pelo CD.'
        value: ${{ jobs.build.outputs.image-digest }}
      coverage:
        description: 'Cobertura de testes apurada, em percentual.'
        value: ${{ jobs.build.outputs.coverage }}
      findings:
        description: 'JSON com a contagem de achados de segurança por severidade.'
        value: ${{ jobs.security.outputs.findings }}

# Sem bloco `permissions` de propósito: em workflow reusável, o que é declarado aqui
# vira exigência sobre quem chama — e pedir mais do que o chamador concedeu faz o run
# falhar na largada, antes de criar job algum. Cada job recebe o que o chamador conceder.
# O guia de consumo lista o que conceder para cada funcionalidade.

jobs:
  # ===========================================================================
  build:
    name: Build & Test
    runs-on: ${{ inputs.runs-on }}
    outputs:
      service-name: ${{ steps.version.outputs.service-name }}
      version: ${{ steps.version.outputs.version }}
      artifact-name: ${{ steps.artifact.outputs.name }}
      image-digest: ${{ steps.image.outputs.digest }}
      image-ref: ${{ steps.image-name.outputs.ref }}
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tassosgomes/template-pipeline
          ref: ${{ inputs.platform-ref }}
          path: .platform

      - id: stack
        uses: ./.platform/actions/detect-stack
        with:
          working-directory: ${{ inputs.working-directory }}

      - id: toolchain
        uses: ./.platform/actions/setup-toolchain
        with:
          stack: java
          version: ${{ inputs.version }}
          package-manager: ${{ steps.stack.outputs.package-manager }}
          working-directory: ${{ inputs.working-directory }}

      - id: version
        uses: ./.platform/actions/resolve-version
        with:
          service-name: ${{ inputs.service-name }}

      - name: Resolver dependências
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          PM: ${{ steps.stack.outputs.package-manager }}
        run: |
          set -euo pipefail
          if [ "$PM" = "gradle" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon dependencies > /dev/null
          else
            mvn -B -ntp dependency:go-offline
          fi

      - name: Lint (Spotless)
        if: inputs.run-lint
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          PM: ${{ steps.stack.outputs.package-manager }}
          EXTRA_ARGS: ${{ inputs.lint-args }}
        run: |
          set -euo pipefail
          # Rodar spotless onde ele não está configurado falharia por goal inexistente,
          # e não por problema de código. Verificamos o manifesto antes.
          if ! grep -qi 'spotless' pom.xml build.gradle build.gradle.kts 2>/dev/null; then
            echo "::warning title=Spotless ausente::Spotless não está configurado no projeto; lint pulado."
            exit 0
          fi
          # shellcheck disable=SC2086
          if [ "$PM" = "gradle" ]; then
            ./gradlew --no-daemon spotlessCheck $EXTRA_ARGS
          else
            mvn -B -ntp spotless:check $EXTRA_ARGS
          fi

      - name: Testes
        if: inputs.run-tests
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          PM: ${{ steps.stack.outputs.package-manager }}
          EXTRA_ARGS: ${{ inputs.test-args }}
          TEST_CONFIGURATION: ${{ inputs.test-configuration }}
        run: |
          set -euo pipefail
          echo "::notice title=Configuração de testes::$TEST_CONFIGURATION (semântica da stack Java)"
          # shellcheck disable=SC2086
          if [ "$PM" = "gradle" ]; then
            ./gradlew --no-daemon test $EXTRA_ARGS
          else
            mvn -B -ntp verify $EXTRA_ARGS
          fi

      - id: coverage
        if: inputs.run-tests
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          set -euo pipefail
          pct=""
          # Monorepo/multi-módulo gera um jacoco.csv por módulo. Usar só o primeiro
          # (head -1) tornava o gate uma loteria: agrega TODOS os relatórios.
          mapfile -t reports < <(find . -path '*/jacoco/jacoco.csv' 2>/dev/null | sort || true)
          if [ "${#reports[@]}" -gt 0 ]; then
            echo "Relatórios JaCoCo encontrados: ${#reports[@]}"
            printf ' - %s\n' "${reports[@]}"
            # Colunas do JaCoCo CSV: ... LINE_MISSED(8), LINE_COVERED(9) ...
            # FNR>1 pula o cabeçalho de CADA arquivo.
            pct=$(awk -F, 'FNR>1 {m+=$8; c+=$9} END {if (m+c > 0) printf "%.2f", c*100/(m+c)}' "${reports[@]}" || true)
          fi

          if [ -z "$pct" ]; then
            echo "::notice title=Cobertura não apurada::Nenhum relatório JaCoCo encontrado. Configure o plugin jacoco com o goal 'report'."
            echo "pct=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          if [ "$THRESHOLD" != "0" ] && awk "BEGIN{exit !($pct < $THRESHOLD)}"; then
            echo "::error title=Cobertura abaixo do mínimo::${pct}% < ${THRESHOLD}%"
            exit 1
          fi
          echo "::notice title=Cobertura::${pct}%"

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          PM: ${{ steps.stack.outputs.package-manager }}
          EXTRA_ARGS: ${{ inputs.build-args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          if [ "$PM" = "gradle" ]; then
            ./gradlew --no-daemon assemble $EXTRA_ARGS
          else
            mvn -B -ntp -DskipTests package $EXTRA_ARGS
          fi

      - id: artifact
        if: inputs.upload-artifact
        shell: bash
        run: echo "name=build-java-${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - if: inputs.upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ inputs.working-directory }}/target/*.jar
            ${{ inputs.working-directory }}/build/libs
          if-no-files-found: ignore
          retention-days: 14

      # ------------------------------------------------------------- container
      - if: inputs.build-container
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: inputs.build-container
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: image-name
        if: inputs.build-container
        shell: bash
        run: |
          set -euo pipefail
          name='${{ inputs.image-name }}'
          [ -z "$name" ] && name="${GITHUB_REPOSITORY##*/}"
          service='${{ steps.version.outputs.service-name }}'
          [ -z "$service" ] || name="${name%/}/$service"
          # O GHCR exige o caminho em minúsculas.
          echo "ref=ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}/${name}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: image
        if: inputs.build-container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker-context != '' && inputs.docker-context || inputs.working-directory }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.working-directory) }}
          push: true
          tags: |
            ${{ steps.image-name.outputs.ref }}:${{ steps.version.outputs.version }}
            ${{ steps.image-name.outputs.ref }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: inputs.build-container
        uses: ./.platform/actions/container-scan
        with:
          image-ref: ${{ steps.image-name.outputs.ref }}@${{ steps.image.outputs.digest }}
          working-directory: ${{ inputs.working-directory }}
          output-file: container.sarif

      - if: inputs.build-container
        uses: ./.platform/actions/upload-findings
        with:
          sarif-file: container.sarif
          category: container
          tool-name: 'Trivy (imagem e configuração)'
          publish: ${{ inputs.publish-findings }}
          severity-fail-on: ${{ inputs.security-fail-on }}
          mode: ${{ inputs.security-mode }}

      - uses: ./.platform/actions/sbom
        with:
          working-directory: ${{ inputs.working-directory }}
          artifact-name: sbom-java-${{ steps.version.outputs.version }}

      - uses: ./.platform/actions/job-summary
        if: always()
        with:
          stack: java
          service-name: ${{ steps.version.outputs.service-name }}
          version: ${{ steps.toolchain.outputs.resolved-version }}
          build-version: ${{ steps.version.outputs.version }}
          test-configuration: ${{ inputs.test-configuration }}
          coverage: ${{ steps.coverage.outputs.pct }}
          coverage-threshold: ${{ inputs.coverage-threshold }}
          artifact-name: ${{ steps.artifact.outputs.name }}
          image-ref: ${{ steps.image-name.outputs.ref }}
          image-digest: ${{ steps.image.outputs.digest }}

  # ===========================================================================
  # Roda em paralelo com o build para não somar ao tempo de feedback do PR.
  security:
    name: Segurança (SAST, segredos, dependências)
    runs-on: ${{ inputs.runs-on }}
    outputs:
      findings: ${{ steps.sast-findings.outputs.counts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud precisa do histórico completo para blame; sem ele, só perde atribuição.
          fetch-depth: ${{ inputs.run-sonar && 0 || 1 }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tassosgomes/template-pipeline
          ref: ${{ inputs.platform-ref }}
          path: .platform

      - id: sast
        if: inputs.run-sast
        uses: ./.platform/actions/sast
        with:
          stack: java
          working-directory: ${{ inputs.working-directory }}

      - id: sast-findings
        if: inputs.run-sast
        uses: ./.platform/actions/upload-findings
        with:
          sarif-file: sast.sarif
          category: sast
          tool-name: 'SAST (Semgrep)'
          publish: ${{ inputs.publish-findings }}
          severity-fail-on: ${{ inputs.security-fail-on }}
          mode: ${{ inputs.security-mode }}

      - if: inputs.run-secret-scan
        uses: ./.platform/actions/secret-scan
        with:
          working-directory: ${{ inputs.working-directory }}

      - if: inputs.run-secret-scan
        uses: ./.platform/actions/upload-findings
        with:
          sarif-file: gitleaks.sarif
          category: secrets
          tool-name: 'Segredos (gitleaks)'
          publish: ${{ inputs.publish-findings }}
          # Segredo vazado não admite modo observação: é sempre bloqueante.
          severity-fail-on: low
          mode: enforce

      - if: inputs.run-dependency-scan
        uses: ./.platform/actions/dependency-scan
        with:
          working-directory: ${{ inputs.working-directory }}

      - if: inputs.run-dependency-scan
        uses: ./.platform/actions/upload-findings
        with:
          sarif-file: dependencies.sarif
          category: dependencies
          tool-name: 'Dependências (Trivy)'
          publish: ${{ inputs.publish-findings }}
          severity-fail-on: ${{ inputs.security-fail-on }}
          mode: ${{ inputs.security-mode }}

      - if: inputs.run-sonar
        uses: ./.platform/actions/sonar-scan
        with:
          stack: java
          phase: scan
          working-directory: ${{ inputs.working-directory }}
          project-key: ${{ inputs.sonar-project-key }}
          organization: ${{ inputs.sonar-organization }}
          host-url: ${{ inputs.sonar-host-url }}
          token: ${{ secrets.sonar-token }}
          mode: ${{ inputs.security-mode }}
          args: ${{ inputs.sonar-args }}

  # ===========================================================================
  dast:
    name: DAST efêmero
    if: inputs.run-dast && inputs.build-container
    needs: build
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tassosgomes/template-pipeline
          ref: ${{ inputs.platform-ref }}
          path: .platform

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: target
        uses: ./.platform/actions/ephemeral-app
        with:
          image-ref: ${{ needs.build.outputs.image-ref }}@${{ needs.build.outputs.image-digest }}
          port: ${{ inputs.dast-port }}
          health-path: ${{ inputs.dast-health-path }}

      - uses: ./.platform/actions/dast-zap
        with:
          target-url: ${{ steps.target.outputs.base-url }}
          scan-type: ${{ inputs.dast-openapi-spec != '' && 'api' || 'baseline' }}
          openapi-spec: ${{ inputs.dast-openapi-spec }}

      - uses: ./.platform/actions/upload-findings
        with:
          sarif-file: dast.sarif
          category: dast
          tool-name: 'DAST (OWASP ZAP)'
          publish: ${{ inputs.publish-findings }}
          severity-fail-on: ${{ inputs.security-fail-on }}
          mode: ${{ inputs.security-mode }}

      # Derruba o alvo mesmo quando o scan falha, para não vazar container entre execuções.
      - if: always()
        shell: bash
        run: docker rm -f "${{ steps.target.outputs.container-name }}" || true
